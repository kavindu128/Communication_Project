; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM13
monitor_port = COM13

; ESP32-S3 uses native USB - these flags are required
; for Serial (USB CDC) to work correctly.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

; The ESP32-S3 Zero ships with a 4MB flash chip, but the default
; esp32-s3-devkitc-1 board definition assumes 8MB. Without this
; override, the bootloader crashes with:
;   "Detected size(4096k) smaller than the size in the binary
;    image header(8192k). Probe failed."
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    knolleary/PubSubClient @ ^2.8.0